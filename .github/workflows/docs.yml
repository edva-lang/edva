name: Documentation

on:
  push:
    branches: [ master, main ]
    paths:
      - 'doc/**'
      - 'operators.yaml'
      - 'GRAMMAR.md'
      - '.github/workflows/docs.yml'
  pull_request:
    branches: [ master, main ]
    paths:
      - 'doc/**'
      - 'operators.yaml'
      - 'GRAMMAR.md'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install LLVM 18 and Clang
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm-18 llvm-18-dev clang-18 libllvm18 lld-18
          sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-18 100
          sudo update-alternatives --install /usr/bin/llvm-config llvm-config /usr/bin/llvm-config-18 100
          sudo update-alternatives --install /usr/bin/wasm-ld wasm-ld /usr/bin/wasm-ld-18 100

      - name: Install Nushell
        uses: hustcer/setup-nu@v3
        with:
          version: '0.115.1'

      - name: Build compiler
        run: make

      - name: Validate evidence, operators, and documentation examples
        run: nu tools/check_docs.nu --compile-examples

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Render Documentation
        run: |
          cd doc
          quarto render
          touch _build/.nojekyll

      - name: Setup Pages
        if: >-
          github.event_name == 'push' &&
          (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
        uses: actions/configure-pages@v6

      - name: Upload artifact
        if: >-
          github.event_name == 'push' &&
          (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
        uses: actions/upload-pages-artifact@v5
        with:
          path: doc/_build

  deploy:
    needs: validate
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
