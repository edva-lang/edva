name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install LLVM 18 and Clang
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm-18 llvm-18-dev clang-18 libllvm18 lld-18
          sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-18 100
          sudo update-alternatives --install /usr/bin/llvm-config llvm-config /usr/bin/llvm-config-18 100
          sudo update-alternatives --install /usr/bin/wasm-ld wasm-ld /usr/bin/wasm-ld-18 100

      - name: Install Nushell
        uses: hustcer/setup-nu@v3
        with:
          version: '0.115.1'

      - name: Build compiler
        run: ./build.sh

      - name: Run test suite
        run: ./run_tests.sh

      - name: Verify 2-stage fixed point
        run: make fixed-point
