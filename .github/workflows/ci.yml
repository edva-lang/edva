name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ubuntu:
    name: Ubuntu 24.04
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install LLVM 18 and Clang
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm-18 llvm-18-dev clang-18 libllvm18 lld-18
          sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-18 100
          sudo update-alternatives --install /usr/bin/llvm-config llvm-config /usr/bin/llvm-config-18 100
          sudo update-alternatives --install /usr/bin/wasm-ld wasm-ld /usr/bin/wasm-ld-18 100

      - name: Install Nushell
        uses: hustcer/setup-nu@v3
        with:
          version: '0.115.1'

      - name: Build compiler and run test suite
        run: ./build.sh

      - name: Verify 2-stage fixed point
        run: make fixed-point

  distros:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    container:
      image: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Arch Linux
            image: archlinux:latest
            setup: |
              pacman -Syu --noconfirm
              pacman -S --noconfirm clang llvm lld make git nushell diffutils file
              git config --global --add safe.directory '*'

          - name: Fedora
            image: fedora:latest
            setup: |
              dnf install -y clang llvm-devel lld make git nushell diffutils findutils file
              git config --global --add safe.directory '*'

    steps:
      - name: Install Dependencies
        run: ${{ matrix.setup }}

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build compiler and run test suite
        run: ./build.sh

      - name: Verify 2-stage fixed point
        run: make fixed-point
