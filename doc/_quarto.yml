project:
  type: book
  output-dir: _build
  resources:
    - "llms.txt"
    - "llms-full.txt"

book:
  title: "Edva"
  subtitle: "A zero-keyword, expression-oriented systems language"
  author: "baldgeorge"
  sidebar:
    collapse-level: 1
  chapters:
    - index.qmd
    - start/quickstart.qmd
    - reference/language/lexical.qmd
    - reference/language/declarations.qmd
    - reference/language/expressions.qmd
    - reference/language/operators.qmd
    - reference/language/intrinsics.qmd
    - reference/types/index.qmd
    - reference/types/string.qmd
    - reference/types/ram.qmd
    - reference/types/record.qmd
    - reference/types/array.qmd
    - reference/types/functions.qmd
    - reference/types/type.qmd
    - reference/types/addr.qmd
    - reference/edva-cli.qmd
    - reference/diagnostics.qmd
    - compiler/architecture.qmd
    - part: reference/stdlib/index.qmd
      chapters:
        - reference/stdlib/ascii.qmd
        - reference/stdlib/base64.qmd
        - reference/stdlib/bench.qmd
        - reference/stdlib/binary.qmd
        - reference/stdlib/ccl.qmd
        - reference/stdlib/cli.qmd
        - reference/stdlib/dom.qmd
        - reference/stdlib/color.qmd
        - reference/stdlib/const.qmd
        - reference/stdlib/crypto.qmd
        - reference/stdlib/csv.qmd
        - reference/stdlib/deque.qmd
        - reference/stdlib/event.qmd
        - reference/stdlib/flate.qmd
        - reference/stdlib/fmt.qmd
        - reference/stdlib/fp.qmd
        - reference/stdlib/fs.qmd
        - reference/stdlib/hash.qmd
        - reference/stdlib/heap.qmd
        - reference/stdlib/hex.qmd
        - reference/stdlib/http.qmd
        - reference/stdlib/img.qmd
        - reference/stdlib/in.qmd
        - reference/stdlib/io.qmd
        - reference/stdlib/json.qmd
        - reference/stdlib/kv.qmd
        - reference/stdlib/libc.qmd
        - reference/stdlib/log.qmd
        - reference/stdlib/math.qmd
        - reference/stdlib/mem.qmd
        - reference/stdlib/net.qmd
        - reference/stdlib/os.qmd
        - reference/stdlib/path.qmd
        - reference/stdlib/rand.qmd
        - reference/stdlib/regex.qmd
        - reference/stdlib/set.qmd
        - reference/stdlib/sort.qmd
        - reference/stdlib/str.qmd
        - reference/stdlib/sys.qmd
        - reference/stdlib/test.qmd
        - reference/stdlib/time.qmd
        - reference/stdlib/type.qmd
        - reference/stdlib/unicode.qmd
        - reference/stdlib/uring.qmd
        - reference/stdlib/url.qmd
        - reference/stdlib/utf.qmd

format:
  html:
    theme:
      light: cosmo
      dark: [cosmo, cosmo-dark.scss]
    respect-user-color-scheme: true
    css: style.css
    toc: true
    number-sections: true
    code-copy: true
    filters:
      - page-meta.lua
    syntax-definitions:
      - dva.xml
